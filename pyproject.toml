[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qibolab-simulator"
version = "0.1.0"
description = "Rotating-frame pulse simulation for Qibolab with QuTiP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "qibolab>=0.2.16,<0.3",
  "qutip>=5.2,<6",
  "numpy>=1.26",
  "scipy>=1.12",
  "pydantic>=2.7,<3",
  "threadpoolctl>=3.5",
]

[project.optional-dependencies]
distributed = ["dask[distributed]>=2024.1"]
dynamiqs = ["dynamiqs>=0.3.7,<0.4"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "build>=1"]
docs = ["sphinx>=8.2,<10", "furo>=2025.7.19", "sphinx-copybutton>=0.5.2,<0.6"]
notebooks = [
  "qibocal",
  "marimo>=0.24,<0.26",
  "plotly>=5.24",
  "qibocal-widgets[marimo]",
]

[tool.uv.sources]
qibocal = { git = "https://github.com/qiboteam/qibocal.git", branch = "protodev" }
qibocal-widgets = { git = "https://github.com/qiboteam/qibocal-widgets.git" }

[tool.uv.dependency-groups]
notebooks = { requires-python = ">=3.11,<3.14" }

[project.urls]
Repository = "https://github.com/qiboteam/qibolab-simulator"
Issues = "https://github.com/qiboteam/qibolab-simulator/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.poe.tasks]
test = { sequence = [
  { cmd = "pytest --cov=qibolab_simulator --cov-report=xml --cov-report=term-missing" },
  { cmd = "python examples/rabi.py" },
], env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
lint = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]
lint-warnings = "ruff check --exit-zero --select C90,N,BLE,A,C4,PIE,RET,SIM,NPY,PERF,RUF ."
notebooks = { sequence = [
  { cmd = "marimo check --strict notebooks/calibration.py notebooks/performance.py" },
  { cmd = "marimo export html notebooks/calibration.py -o docs/source/_extra/calibration.html" },
], env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
sphinx = "sphinx-build -W --keep-going -b html docs/source docs/build/html"
docs = { sequence = [{ ref = "notebooks" }, { ref = "sphinx" }] }

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]

[tool.coverage.run]
source = ["qibolab_simulator"]

[tool.coverage.report]
show_missing = true
