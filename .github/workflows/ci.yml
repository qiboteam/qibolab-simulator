name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra distributed
      - run: uv run --no-sync pytest --cov=qibolab_simulator --cov-report=term-missing
      - run: uv run --no-sync python examples/rabi.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

  wheels:
    uses: qiboteam/workflows/.github/workflows/wheels.yml@e0d551fe6b04339871058a3eb99522fb13dae176 # uv
    with:
      os: ubuntu-latest
      python-version: "3.12"
      uv-extras: "--locked --no-dev"
      publish: false

  qibocal:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group notebooks
      - run: uv run --no-sync pytest tests/test_split_transmons.py tests/test_qibocal.py
      - run: uv run --no-sync marimo check --strict notebooks/calibration.py
      - run: uv run --no-sync marimo export html notebooks/calibration.py -o "$RUNNER_TEMP/calibration.html" -- --protocol rabi_amplitude
