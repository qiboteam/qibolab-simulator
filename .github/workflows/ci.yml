name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    uses: qiboteam/workflows/.github/workflows/test.yml@uv
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      uv-extras: "--locked --extra distributed"
    secrets: inherit

  wheels:
    uses: qiboteam/workflows/.github/workflows/wheels.yml@uv
    with:
      os: ubuntu-latest
      python-version: "3.12"
      uv-extras: "--locked --no-dev"
      publish: false

  qibocal:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: qiboteam/workflows/actions/uv/setup@uv
        with:
          python-version: "3.12"
      - run: uv sync --locked --group notebooks
      - run: uv run --no-sync pytest tests/test_split_transmons.py tests/test_qibocal.py
      - run: uv run --no-sync marimo check --strict notebooks/calibration.py
      - run: uv run --no-sync marimo export html notebooks/calibration.py -o "$RUNNER_TEMP/calibration.html" -- --protocol rabi_amplitude
