name: Docs build

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: qiboteam/workflows/.github/workflows/docs.yml@uv
    with:
      python-version: "3.12"
      uv-extras: "--locked --no-dev --group docs --group notebooks --extra dynamiqs"
      output-path: docs/build/html
